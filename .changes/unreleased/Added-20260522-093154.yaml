kind: Added
body: "Added retry configuration to Contentstack provider. New provider attributes: `max_retries` (max retry attempts for 429 responses, defaults to 3), `retry_wait_min` (min wait time in seconds, defaults to 1), and `retry_wait_max` (max wait time in seconds, defaults to 30). Enables reliable Terraform operations by automatically retrying on Contentstack API rate limit responses with configurable exponential backoff."
